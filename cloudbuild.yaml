# Cloud Build pipeline — single source of truth for build + deploy.
#
# `infra/deploy.sh [prod|staging]` invokes this with substitutions populated
# from `infra/env/<target>.env` so the same pipeline produces a correct prod
# or staging deployment.
#
# Required substitutions (no defaults — deploy.sh must set them):
#   _BUCKET        GCS bucket holding serving/*.parquet
#   _SERVICE       Cloud Run service name
#   _ENVIRONMENT   "production" or "staging" (read by the backend)
#   _CORS_REGEX    Anchored CORS allowlist regex
#   _MEMORY        e.g. "2Gi"
#   _CPU           e.g. "1"
#   _MIN_INSTANCES e.g. "0"
#   _MAX_INSTANCES e.g. "5"
#   _TIMEOUT       Request timeout in seconds, e.g. "120"
#
# Optional:
#   _CORS_ORIGINS  Comma-separated explicit origins (default empty)
#   _SA_NAME       Service account local name (default "bizkaia-backend")
#   _SECRET_NAME   Secret Manager secret holding JWT_SECRET (default "bizkaia-jwt-secret")
#   _AR_REPO       Artifact Registry repository name (default "bizkaia-images")

substitutions:
  _CORS_ORIGINS: ''
  _SA_NAME: 'bizkaia-backend'
  _SECRET_NAME: 'bizkaia-jwt-secret'
  _AR_REPO: 'bizkaia-images'

steps:
  # ─── Run backend + worker tests before building/deploying ──────────────
  # A failing test must block the deploy. We can't run pytest inside the
  # production image (it has no dev deps and runs as a non-root user), so
  # spin up fresh python containers in the workspace and pip-install only
  # what pytest needs. Both jobs run in parallel.

  - id: backend-tests
    name: python:3.11-slim
    entrypoint: bash
    waitFor: ['-']
    dir: backend
    args:
      - -c
      - |
        set -euo pipefail
        pip install --quiet --upgrade pip
        pip install --quiet . pytest pytest-asyncio httpx
        python -m pytest -x --tb=short

  - id: worker-tests
    name: python:3.11-slim
    entrypoint: bash
    waitFor: ['-']
    dir: worker
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update -qq && apt-get install -y --no-install-recommends \
          libgdal-dev gcc g++ >/dev/null
        pip install --quiet --upgrade pip
        pip install --quiet . pytest
        python -m pytest -x --tb=short

  - id: build-image
    name: 'gcr.io/cloud-builders/docker'
    waitFor: ['backend-tests', 'worker-tests']
    args:
      - 'build'
      - '-f'
      - 'docker/cloudrun.Dockerfile'
      - '-t'
      - 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID'
      - '-t'
      - 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest'
      - '.'

  - id: deploy
    name: 'gcr.io/cloud-builders/gcloud'
    waitFor: ['build-image']
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE}'
      - '--image=europe-southwest1-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID'
      - '--region=europe-southwest1'
      - '--project=$PROJECT_ID'
      - '--service-account=${_SA_NAME}@$PROJECT_ID.iam.gserviceaccount.com'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--timeout=${_TIMEOUT}'
      - '--startup-probe=httpGet.path=/readiness,initialDelaySeconds=5,periodSeconds=5,failureThreshold=20'
      - '--set-env-vars=DATA_SOURCE=gcs,GCS_BUCKET=${_BUCKET},GCS_PREFIX=serving,ENVIRONMENT=${_ENVIRONMENT},CORS_ORIGINS=${_CORS_ORIGINS},CORS_ORIGIN_REGEX=${_CORS_REGEX}'
      - '--set-secrets=JWT_SECRET=${_SECRET_NAME}:latest'
      - '--allow-unauthenticated'

images:
  - 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$BUILD_ID'
  - 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:latest'
