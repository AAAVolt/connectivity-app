# Alert if /readiness keeps returning 503 for 3 minutes after startup.
# This catches Parquet-schema contract violations (failed init_db),
# DuckDB load failures, or GCS download failures — anything that prevents
# is_ready() from returning True.
#
# 3 minutes is long enough to ride out a normal cold start (which can take
# 30-60s while GCS files download) but short enough to surface a stuck
# instance before users notice.

displayName: "Bizkaia API · /readiness 503 sustained"
combiner: OR
conditions:
  - displayName: "/readiness 503 for 3m"
    conditionThreshold:
      filter: |
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "bizkaia-api"
        AND metric.type = "run.googleapis.com/request_count"
        AND metric.labels.response_code = "503"
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_RATE
          crossSeriesReducer: REDUCE_SUM
      comparison: COMPARISON_GT
      thresholdValue: 0  # any sustained 503 traffic
      duration: 180s
      trigger:
        count: 1

notificationChannels:
  - "projects/bizkaia-conn-pub/notificationChannels/REPLACE_ME"

alertStrategy:
  autoClose: 3600s
