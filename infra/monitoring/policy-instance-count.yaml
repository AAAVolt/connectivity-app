# Alert when the running container-instance count approaches the cap.
# Service is configured with --max-instances=5 (deploy.sh / cloudbuild.yaml).
# Sustained instance_count > 4 means we're scaling against the ceiling and
# requests will start queueing once we hit the cap.

displayName: "Bizkaia API · instance count near max"
combiner: OR
conditions:
  - displayName: "instance_count > 4 sustained 10m"
    conditionThreshold:
      filter: |
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "bizkaia-api"
        AND metric.type = "run.googleapis.com/container/instance_count"
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_MEAN
          crossSeriesReducer: REDUCE_MAX
      comparison: COMPARISON_GT
      thresholdValue: 4
      duration: 600s
      trigger:
        count: 1

notificationChannels:
  - "projects/bizkaia-conn-pub/notificationChannels/REPLACE_ME"

alertStrategy:
  autoClose: 86400s
