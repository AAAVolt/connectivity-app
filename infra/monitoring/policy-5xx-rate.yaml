# Alert when the 5xx response rate exceeds 1% over a 5-minute window.
# Cloud Run emits run.googleapis.com/request_count with response_code_class
# label so we can ratio 5xx vs total.

displayName: "Bizkaia API · 5xx rate > 1%"
combiner: OR
conditions:
  - displayName: "5xx ratio > 1% (5m rolling)"
    conditionThreshold:
      filter: |
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "bizkaia-api"
        AND metric.type = "run.googleapis.com/request_count"
        AND metric.labels.response_code_class = "5xx"
      aggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_RATE
          crossSeriesReducer: REDUCE_SUM
      denominatorFilter: |
        resource.type = "cloud_run_revision"
        AND resource.labels.service_name = "bizkaia-api"
        AND metric.type = "run.googleapis.com/request_count"
      denominatorAggregations:
        - alignmentPeriod: 60s
          perSeriesAligner: ALIGN_RATE
          crossSeriesReducer: REDUCE_SUM
      comparison: COMPARISON_GT
      thresholdValue: 0.01
      duration: 300s
      trigger:
        count: 1

# Replace with the actual channel name from
#   gcloud beta monitoring channels list --project=bizkaia-conn-pub
notificationChannels:
  - "projects/bizkaia-conn-pub/notificationChannels/REPLACE_ME"

alertStrategy:
  autoClose: 86400s  # auto-resolve after 24h if it stops firing
