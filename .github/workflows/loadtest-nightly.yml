name: Nightly load test

on:
  schedule:
    # 03:00 UTC = 04:00 / 05:00 Europe/Madrid (depending on DST). Late
    # enough to be off peak; before workday hours so a regression is
    # waiting in your inbox when you start.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      target_url:
        description: "Backend URL to load-test (overrides the staging default)"
        required: false
        default: ""

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target URL
        id: target
        env:
          STAGING_URL: ${{ vars.STAGING_API_URL }}
          PROD_URL: ${{ vars.PROD_API_URL }}
          MANUAL_URL: ${{ inputs.target_url }}
        run: |
          # Priority: workflow_dispatch input → repo var STAGING_API_URL
          # → repo var PROD_API_URL. The cron path always picks staging
          # if set; manual runs can override per-invocation.
          if [ -n "$MANUAL_URL" ]; then
            echo "url=$MANUAL_URL" >> "$GITHUB_OUTPUT"
            echo "Using manual override: $MANUAL_URL"
          elif [ -n "$STAGING_URL" ]; then
            echo "url=$STAGING_URL" >> "$GITHUB_OUTPUT"
            echo "Using staging: $STAGING_URL"
          elif [ -n "$PROD_URL" ]; then
            echo "::warning::No staging URL set; falling back to prod. Set STAGING_API_URL repo variable to silence this."
            echo "url=$PROD_URL" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No load-test target configured. Set repo variable STAGING_API_URL or PROD_API_URL."
            exit 1
          fi

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update -qq
          sudo apt-get install -y k6

      - name: Run k6
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
        run: k6 run --summary-export=summary.json loadtest/cells.js

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-summary-${{ github.run_id }}
          path: summary.json
          retention-days: 30

      - name: File issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const target = process.env.TARGET_URL || 'unknown';
            await github.rest.issues.create({
              owner,
              repo,
              title: `Nightly k6 load test failed (${new Date().toISOString().slice(0,10)})`,
              labels: ['regression', 'loadtest'],
              body: [
                `Nightly load test against \`${target}\` violated thresholds.`,
                ``,
                `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                ``,
                `Thresholds (see \`loadtest/cells.js\`):`,
                `- http_req_failed < 1%`,
                `- http_req_duration p95 < 2s`,
                `- cells_geojson_latency p95 < 3s`,
                `- dashboard_summary_latency p95 < 1.5s`,
                ``,
                `Download the \`k6-summary-${context.runId}\` artifact from the run for the breakdown.`,
              ].join('\n'),
            });
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
