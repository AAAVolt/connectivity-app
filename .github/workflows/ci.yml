name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # `defaults.working-directory` only affects `run:` steps; action
        # `with:` params resolve relative to the repo root. Without this
        # explicit path the action looks for `package.json` at the root
        # and errors with "No pnpm version is specified".
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: npx tsc --noEmit
      - run: pnpm test -- --run
      - run: pnpm build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/poetry.lock
      # Resolve against poetry.lock so CI tests run on the same dep graph
      # as the shipped Cloud Run image. `pip install .` would resolve a
      # different version set, which defeats the purpose of a test gate.
      - name: Install dependencies
        run: |
          pip install --upgrade pip 'poetry==1.8.3' pip-audit
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-ansi --with dev -E gcs
      - run: python -m pytest -x --tb=short
      - name: Audit production Python dependencies
        # Audit only the deps that ship to Cloud Run. Without `--only main`
        # we'd flag CVEs in poetry/pytest themselves — those are dev tools,
        # never deployed, and would block the gate on irrelevant noise.
        run: |
          poetry export --only main --without-hashes -f requirements.txt -o /tmp/prod-reqs.txt
          pip-audit --requirement /tmp/prod-reqs.txt --strict

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history to scan past commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  e2e:
    # Golden-path Playwright tests against a production-mode `next start`.
    # Dev mode's on-demand compile makes the map test flaky on cold runs,
    # so CI builds once and serves the artefact.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Tests assume a backend is reachable. Until staging is live, point
      # this at prod (the API is public-read). Override the variable in CI
      # to hit staging once available.
      BACKEND_CLOUD_RUN_URL: ${{ vars.BACKEND_CLOUD_RUN_URL || 'https://bizkaia-api-cos3esbs4a-no.a.run.app' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - run: pnpm e2e:install
      # Prebuild so playwright's webServer can `next start` instead of
      # `next dev`. Saves ~30s on first request and removes a major
      # source of map-test flakes.
      - run: pnpm build
      # Warm the backend before Playwright starts. Cloud Run scales to
      # zero, so the first request after idle pays a 10–15s cold start
      # *plus* the dashboard *-ranking endpoints run a heavy spatial
      # join that's ~18s on cold cache. The dashboard hook fires all
      # of these in a Promise.all and renders nothing until they resolve;
      # warming them here gets us cached responses by the time the test
      # opens the page.
      - name: Warm backend (skip on failure — readiness test will retry)
        continue-on-error: true
        env:
          DEPT: "departure_time=08:00"
        run: |
          for i in 1 2 3; do
            if curl -sf -m 60 "$BACKEND_CLOUD_RUN_URL/readiness" >/dev/null; then
              echo "backend ready"; break
            fi
            echo "readiness attempt $i failed, retrying..."; sleep 5
          done
          # Warm the slow endpoints sequentially. We don't care about the
          # response, just that the cache is populated.
          for path in "/dashboard/comarca-ranking?$DEPT" "/dashboard/municipality-ranking?$DEPT" "/sociodemographic/profiles"; do
            echo "warming $path"
            curl -sf -m 60 "$BACKEND_CLOUD_RUN_URL$path" -H "X-Tenant-ID: 00000000-0000-0000-0000-000000000001" >/dev/null \
              || echo "  warm of $path failed (continuing)"
          done
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
